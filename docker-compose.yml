services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proxy_manager
      POSTGRES_USER: proxy_manager
      POSTGRES_PASSWORD: proxy_manager
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # host-exposed only for local debugging (e.g. `psql -h localhost -p 5442`),
      # the app talks to the db over the internal Docker network (db:5432) regardless
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxy_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      # Spring Boot maps these onto the matching properties automatically
      # (relaxed binding: SPRING_DATASOURCE_URL -> spring.datasource.url, etc.) -
      # no extra wiring needed on the application.yml/Java side.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/proxy_manager
      SPRING_DATASOURCE_USERNAME: proxy_manager
      SPRING_DATASOURCE_PASSWORD: proxy_manager
      # Change these for any deployment beyond your own machine.
      APP_JWT_SECRET: n327QFgidzUhMLgpaXRF3WgS2zxqf5ZA77gzGMFfe74=
      APP_ADMIN_DEFAULT_USERNAME: admin
      APP_ADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
