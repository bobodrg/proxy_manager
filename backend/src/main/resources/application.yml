server:
  port: 8080

spring:
  application:
    name: proxy-manager
  datasource:
    url: jdbc:postgresql://localhost:5434/proxy_manager
    username: proxy_manager
    password: proxy_manager
  jpa:
    hibernate:
      # update: Hibernate creates/updates tables automatically from the entities.
      # Convenient for learning; a real project would use migrations (Flyway/Liquibase) instead.
      ddl-auto: update
    show-sql: true

management:
  endpoint:
    gateway:
      # the gateway endpoint is disabled by default (enableByDefault = false in the
      # Spring Cloud Gateway source), so exposing it below isn't enough - it must be enabled explicitly
      enabled: true
  endpoints:
    web:
      exposure:
        # exposes POST /actuator/gateway/refresh - useful for Phase 1, to manually trigger
        # a RefreshRoutesEvent before we have the Admin API (Phase 2)
        include: gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

app:
  jwt:
    # HS256 needs a secret of at least 256 bits: this one is a randomly generated
    # base64 value, fine for local dev/portfolio use. A real deployment would load
    # this from an environment variable or a secrets manager instead of committing it.
    secret: n327QFgidzUhMLgpaXRF3WgS2zxqf5ZA77gzGMFfe74=
    expiration-minutes: 60
  admin:
    # used once by AdminUserSeeder to create the first admin user if app_user is empty.
    # Change this (or override via env var) before deploying anywhere but localhost.
    default-username: admin
    default-password: admin123
